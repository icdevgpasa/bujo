<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe4" />
    <script>
      // Apply the chosen look before the first paint (see src/theme.ts).
      try {
        var bars = {
          paper: ['#f3efe4', '#1c2230'],
          modern: ['#f3f4f6', '#121418'],
          squared: ['#fdfdfb', '#141c2e'],
          kraft: ['#d6bc93', '#2a2119'],
        }
        var theme = localStorage.getItem('bujo:theme')
        var dark = localStorage.getItem('bujo:dark')
        // The old Nocny theme became night mode on the paper notebook.
        if (theme === 'night') {
          theme = 'paper'
          dark = 'on'
          localStorage.setItem('bujo:theme', theme)
          localStorage.setItem('bujo:dark', dark)
        }
        if (!bars[theme]) theme = 'paper'
        var night = dark === 'on' || (dark === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = theme
        if (night) document.documentElement.dataset.dark = ''
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[theme][night ? 1 : 0])
      } catch {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bujo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
