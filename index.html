<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe4" />
    <script>
      // Apply the chosen look before the first paint (see src/theme.ts).
      try {
        if (localStorage.getItem('bujo:theme') === 'modern') {
          document.documentElement.dataset.theme = 'modern'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f4f6')
        }
      } catch {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bujo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
